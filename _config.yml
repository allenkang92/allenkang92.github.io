# Site settings
title: Allen's Blog
description: Striving for a better tomorrow, together with you.
url: "https://allenkang92.github.io" # 웨사이트 주소
lang: ko_KR
github_username: allenkang92
author: Allen Kang
email: ksw8841@knou.ac.kr
baseurl: "" # 서브디렉토리가 있을 경우 예: /blog
google_analytics: G-C2BXF21DKW
logo: /assets/images/icons/icon-512.png # jekyll-seo-tag가 og:image로 사용

# Build settings
markdown: kramdown
highlighter: rouge
incremental: false

# Kramdown 설정
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
  parse_span_html: true

# Jekyll 플러그인
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# 에셋 최적화
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: [html, head, body]
  blanklines: false
  profile: false

# Directory settings
source: .
destination: ./_site
layouts_dir: _layouts
includes_dir: _includes
data_dir: _data

# Exclude from processing
exclude:
  - AGENTS.md
  - DESIGN.md
  - BLOG_OPERATIONS.md
  - CONTENT_STRATEGY.md
  - docs
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - README.md

# Collections
collections:
  posts:
    output: true
    permalink: /posts/:title/
  achievements:
    output: true
    permalink: /achievements/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      image: /assets/images/icons/icon-512.png # og:image 기본값 (jekyll-seo-tag)
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      permalink: /posts/:title/
      image: /assets/images/icons/icon-512.png # og:image 기본값 (jekyll-seo-tag)
  - scope:
      path: ""
      type: "achievements"
    values:
      layout: "achievement"
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "page"

# Include
include:
  - _pages
